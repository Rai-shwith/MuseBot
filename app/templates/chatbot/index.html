<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rasa Chatbot</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        #chat-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        #chat-box {
            height: 300px;
            overflow-y: scroll;
            margin-bottom: 10px;
        }

        #messages {
            display: flex;
            flex-direction: column;
        }

        .message {
            margin: 5px 0;
            padding: 10px;
            border-radius: 10px;
        }

        .message.user {
            align-self: flex-end;
            background-color: #007bff;
            color: white;
        }

        .message.bot {
            align-self: flex-start;
            background-color: #f1f1f1;
        }
    </style>
</head>

<body>
    <div id="chat-container">
        <div id="chat-box">
            <div id="messages"></div>
        </div>
        <input type="text" id="user-input" placeholder="Type a message..." autofocus>
        <button id="send-button">Send</button>
    </div>
    <script>
        // fetch('http://localhost:5005/webhooks/rest/webhook', {
        //     method: 'POST',
        //     headers: {
        //         'Content-Type': 'application/json'
        //     },
        //     body: JSON.stringify({ message: "start" })
        // })
        //     .then(response => response.json())
        //     .then(data => {
        //         data.forEach(message => {
        //             if (message.text) {
        //                 appendMessage('bot', message.text);
        //             }
        //             if (message.buttons) {
        //                 renderButtons(message.buttons);
        //             }
        //         });
        //     });
        // document.getElementById('send-button').addEventListener('click', function () {
        //     sendMessage();
        // });

        document.getElementById('user-input').addEventListener('keypress', function (event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        function sendMessage(messageText) {
            const userInput = messageText || document.getElementById('user-input').value;
            if (userInput.trim() === '') return;

            appendMessage('user', userInput);

            fetch('http://localhost:5005/webhooks/rest/webhook', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message: userInput })
            })
                .then(response => response.json())
                .then(data => {
                    data.forEach(message => {
                        if (message.text) {
                            appendMessage('bot', message.text);
                        }
                        if (message.buttons) {
                            renderButtons(message.buttons);
                        }
                    });
                });

            document.getElementById('user-input').value = '';
        }

        function appendMessage(sender, message) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', sender);
            messageElement.textContent = message;
            document.getElementById('messages').appendChild(messageElement);
            document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
        }

        function renderButtons(buttons) {
            const buttonsContainer = document.createElement('div');
            buttonsContainer.classList.add('buttons-container');

            buttons.forEach(button => {
                const buttonElement = document.createElement('button');
                buttonElement.textContent = button.title;
                buttonElement.classList.add('button');
                buttonElement.addEventListener('click', () => {
                    sendMessage(button.payload);
                });
                buttonsContainer.appendChild(buttonElement);
            });

            document.getElementById('messages').appendChild(buttonsContainer);
            document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
        }

    </script>
</body>

</html>
